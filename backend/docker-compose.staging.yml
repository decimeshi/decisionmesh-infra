# ============================================================
# docker-compose.staging.yml — standalone staging stack
# Completely self-contained; does NOT extend docker-compose.yml.
#
# Key differences from prod:
#   - Vault (HashiCorp) uses FILE storage + an auto-unseal sidecar,
#     mirroring prod's durable OpenBao setup. Survives reboots.
#   - Caddy is commented out (use docker-compose.gateway.yml instead)
#   - postgres uses pgvector image (same as prod)
#
# One-time setup (fresh vault): bash scripts/init-vault-staging.sh
#
# Start:
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
# ============================================================

name: decisionmesh-staging

networks:
  internal:
    name: decisionmesh-staging_internal
    driver: bridge

services:

  # ----------------------------------------------------------
  # API
  # ----------------------------------------------------------
  api:
    image: ${API_IMAGE:?API_IMAGE must be set in .env.staging}
    container_name: dm-api-staging
    restart: unless-stopped
    environment:
      QUARKUS_PROFILE:   staging
      QUARKUS_HTTP_PORT: 8081
      VAULT_TOKEN:       ${VAULT_TOKEN:?VAULT_TOKEN must be set in .env.staging}
      VAULT_ADDR:        http://openbao:8200
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m
    networks:
      - internal

  # ----------------------------------------------------------
  # PostgreSQL — pgvector required for vector embeddings
  # ----------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME:-decisionmesh}
      POSTGRES_USER:     ${DB_USER:-decisionmesh}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env.staging}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-decisionmesh} -d ${DB_NAME:-decisionmesh}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes:
      - postgres-staging-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m
    networks:
      - internal

  # ----------------------------------------------------------
  # Redis
  # ----------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env.staging}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320m
    networks:
      - internal

  # ----------------------------------------------------------
  # Vault (HashiCorp) — FILE storage, durable across reboots.
  # Comes up SEALED after a restart; the openbao-unsealer sidecar
  # re-unseals it automatically. One-time init via
  # scripts/init-vault-staging.sh (never `-dev` mode).
  # ----------------------------------------------------------
  openbao:
    image: hashicorp/vault:1.15
    container_name: decisionmesh-staging-openbao-1
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    volumes:
      - openbao-staging-data:/vault/file
      - /home/decisionmesh/dm-config/vault-staging.hcl:/vault/config/vault.hcl:ro
    command: server
    healthcheck:
      # Exit 0 only when reachable AND unsealed, so `api` (which waits on
      # service_healthy) won't start until the sidecar has unsealed vault.
      test: ["CMD-SHELL", "vault status -address=http://127.0.0.1:8200 -format=json 2>/dev/null | grep -q '\"sealed\": false'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 192m
    networks:
      - internal

  # ----------------------------------------------------------
  # Vault auto-unseal sidecar (staging)
  # Watches vault; whenever it's sealed, unseals it with the key
  # at /unseal.key. Recovers VM/daemon/container restarts.
  # Uses the `vault` binary (HashiCorp), not `bao`.
  # ----------------------------------------------------------
  openbao-unsealer:
    image: hashicorp/vault:1.15
    container_name: decisionmesh-staging-openbao-unsealer-1
    restart: unless-stopped
    depends_on:
      - openbao
    environment:
      VAULT_ADDR: http://openbao:8200
    entrypoint: ["/bin/sh", "/usr/local/bin/unsealer.sh"]
    volumes:
      - /opt/decisionmesh/infra/scripts/vault-unsealer.sh:/usr/local/bin/unsealer.sh:ro
      - /opt/decisionmesh/secrets/vault-staging-unseal.key:/unseal.key:ro
    # Raised 64m -> 128m (2026-09-20): observed at 93.99% of the old 64m
    # cap (60.16 MiB) in a docker stats snapshot — never actually
    # OOM-killed (confirmed via `docker inspect .State.OOMKilled` =
    # false, RestartCount = 0), but too thin a margin for a
    # HashiCorp vault CLI binary's baseline footprint. Cheap to double —
    # this is a ~4.8 GiB declared-limits host with several GiB of
    # headroom, not a capacity-constrained bump.
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - internal

  # ----------------------------------------------------------
  # Ollama — CPU-only; disable to save RAM if not needed
  # ----------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:11434/api/tags > /dev/null"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    volumes:
      - ollama-staging-data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 3g
    networks:
      - internal

volumes:
  postgres-staging-data:
  ollama-staging-data:
  openbao-staging-data: