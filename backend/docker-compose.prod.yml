name: decisionmesh

networks:
  internal:
    name: decisionmesh_internal

services:

  api:
    image: ${API_IMAGE:?API_IMAGE must be set in .env.prod}
    container_name: dm-api
    restart: unless-stopped
    environment:
      QUARKUS_PROFILE:   prod
      QUARKUS_HTTP_PORT: 8080
      VAULT_TOKEN:       ${VAULT_TOKEN:?VAULT_TOKEN must be set in .env.prod}
      VAULT_ADDR:        http://openbao:8200
      QUARKUS_REDIS_PASSWORD: ${REDIS_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      openbao:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m
    networks:
      - internal

  postgres:
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          memory: 512m

  redis:
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 320m

  openbao:
    restart: unless-stopped
    command: server -config=/openbao/config/openbao.hcl
    environment:
      BAO_ADDR: http://127.0.0.1:8200
    healthcheck:
      test: ["CMD-SHELL", "bao status -address=http://127.0.0.1:8200 | grep -q 'Sealed.*false'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    volumes:
      - openbao-data:/openbao/data
      - /home/decisionmesh/dm-config/openbao.hcl:/openbao/config/openbao.hcl:ro
    deploy:
      resources:
        limits:
          memory: 192m

  # Auto-unseal sidecar (prod) — added 2026-09-20 to remove the manual
  # unseal-prod.sh step after every prod restart. Mirrors staging's
  # openbao-unsealer, adapted for prod's real image/script pairing:
  # prod runs openbao/openbao:2 (the `bao` binary), so this uses
  # openbao-unsealer.sh (bao status/unseal), NOT vault-unsealer.sh
  # (staging's HashiCorp `vault` binary script) — using the wrong
  # script for the wrong binary would fail silently in a loop.
  #
  # REQUIRES a one-time manual step before first start: extract the
  # single unseal key openbao-unsealer.sh expects as a plain file
  # (unlike unseal-prod.sh, which parses the full init JSON itself):
  #   python3 -c "import json; print(json.load(open('/opt/decisionmesh/secrets/openbao-init.json'))['unseal_keys_b64'][0])" \
  #     > /opt/decisionmesh/secrets/openbao-prod-unseal.key
  #   chmod 600 /opt/decisionmesh/secrets/openbao-prod-unseal.key
  openbao-unsealer:
    image: openbao/openbao:2
    container_name: decisionmesh-openbao-unsealer-1
    restart: unless-stopped
    depends_on:
      openbao:
        condition: service_healthy
    environment:
      BAO_ADDR: http://openbao:8200
    entrypoint: ["/bin/sh", "/usr/local/bin/unsealer.sh"]
    volumes:
      - /opt/decisionmesh/infra/scripts/openbao-unsealer.sh:/usr/local/bin/unsealer.sh:ro
      - /opt/decisionmesh/secrets/openbao-prod-unseal.key:/unseal.key:ro
    deploy:
      resources:
        limits:
          memory: 128m
    networks:
      - internal

  ollama:
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 3g

volumes:
  postgres-data:
  openbao-data:
  ollama-data:
